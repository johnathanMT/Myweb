<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover → safe-area-inset env() works on iPhone notch + Dynamic Island.
      interactive-widget=resizes-visual → prevents layout reflow when virtual keyboard opens on mobile.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Prevent iOS from auto-linking phone/address/dates in content -->
    <meta name="format-detection" content="telephone=no, address=no, email=no" />

    <!-- CSP is enforced at the HTTP header level via vercel.json (harder to bypass than a meta tag).
         This meta tag is kept as a defence-in-depth fallback for non-Vercel environments only. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' https://res.cloudinary.com blob:; connect-src 'self' blob: https://myweb-zqv1.onrender.com https://www.gstatic.com https://api.unsplash.com https://ipapi.co https://nominatim.openstreetmap.org https://res.cloudinary.com; upgrade-insecure-requests;">

    <!-- ════════════════ SEO / Social ════════════════ -->
    <title>Myo Thant Naing — AI &amp; Full-Stack Engineer · BSc Computer Science (in progress)</title>
    <meta name="description"
        content="Portfolio of Myo Thant Naing — AI & Full-Stack Engineer in Japan, building full-stack apps (C#/.NET, React, Three.js) and Agentic AI systems. From caring to coding." />
    <meta name="author" content="Myo Thant Naing" />
    <meta name="keywords"
        content="Myo Thant Naing, Software Engineer, AI Engineer, Computer Science, C# .NET, React, Three.js, WebGL, Full-Stack Developer, Portfolio, Japan" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#07070A" />
    <link rel="canonical" href="https://myothant.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Myo Thant Naing" />
    <meta property="og:title" content="Myo Thant Naing — AI & Full-Stack Engineer" />
    <meta property="og:description"
        content="AI & Full-Stack Engineer in Japan. Full-stack (C#/.NET, React) + Agentic AI. From caring to coding." />
    <meta property="og:url" content="https://myothant.dev/" />
    <meta property="og:image" content="https://myothant.dev/Myweb_photo/My_profile2_for_myweb.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Myo Thant Naing — AI & Full-Stack Engineer" />
    <meta name="twitter:description" content="AI & Full-Stack Engineer in Japan. BSc Computer Science (in progress)." />
    <meta name="twitter:image" content="https://myothant.dev/Myweb_photo/My_profile2_for_myweb.jpg" />

    <!-- Structured data (Google rich results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Myo Thant Naing",
      "alternateName": "MTN",
      "url": "https://myothant.dev/",
      "image": "https://myothant.dev/Myweb_photo/My_profile2_for_myweb.jpg",
      "jobTitle": "AI & Full-Stack Engineer",
      "description": "AI & Full-Stack Engineer in Japan, building full-stack applications (C#/.NET, React) and Agentic AI systems.",
      "knowsAbout": ["Software Engineering", "Artificial Intelligence", "C#", ".NET", "React", "Three.js", "Computer Science", "Full-Stack Development"],
      "sameAs": ["https://github.com/johnathanMT"]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

    <!-- Fonts + Font Awesome load NON-render-blocking (preload → stylesheet via
         /css-swap.js) so third-party CSS latency never delays first paint on
         mobile. <noscript> keeps them working when JS is unavailable. -->
    <link rel="preload" as="style" data-async-style
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&family=Padauk:wght@400;700&family=Noto+Sans+Myanmar:wght@400;500;600;700;800&family=Orbitron:wght@400;600;700;800;900&display=swap" />
    <link rel="preload" as="style" data-async-style
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <noscript>
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&family=Padauk:wght@400;700&family=Noto+Sans+Myanmar:wght@400;500;600;700;800&family=Orbitron:wght@400;600;700;800;900&display=swap" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    </noscript>
    <script src="/css-swap.js" defer></script>

    <!-- First-paint colours only (CSP-safe inline style, no JS): the page background
         and wordmark that stand in for the few frames before React renders. -->
    <style>
        html{background:#07070A}
        #prepaint{padding:22px 24px;font:600 14px/1.4 system-ui,sans-serif;letter-spacing:.04em;color:#96AACA}
        @media (prefers-color-scheme: light){html:not([data-theme="dark"]){background:#F6F8FC}#prepaint{color:#475569}}
        html[data-theme="light"]{background:#F6F8FC}
    </style>
</head>

<body>
    <!-- Crawler / no-JS fallback: gives search engines real content for this SPA -->
    <noscript>
        <h1>Myo Thant Naing — AI &amp; Full-Stack Engineer</h1>
        <p>AI &amp; Full-Stack Engineer based in Japan, building full-stack
            applications with C#/.NET and React, plus Agentic AI systems and 3D WebGL experiences.</p>
        <p>Please enable JavaScript to view the full interactive portfolio.</p>
    </noscript>

    <!-- React replaces this wordmark on its first render. No overlay, no timers. -->
    <div id="root"><div id="prepaint" aria-hidden="true">MTN.Digitosphere</div></div>

    <script type="module" src="/src/main.tsx"></script>
    <!-- api.js (window.PortfolioAPI) is loaded only by the legacy blog.html / admin.html
         pages that use it; the React app never touches it, so it isn't fetched here. -->

</body>

</html>
